name: ESLint

on:
  push:
    branches: [ alpha ]
  pull_request:
    branches: [ alpha ]

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint baseline check
        run: npm run lint:check
