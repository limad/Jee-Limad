# Filtre Fail2Ban OPTIONNEL pour le login web Jeedom.
# A deployer manuellement par l'utilisateur (voir docs/SECURITY-HARDENING.md).
# Matche le marqueur stable FAILED_LOGIN (independant de la langue).
[Definition]
# fail2ban retire la date (datepattern) avant d'appliquer failregex : l'expression part donc de [NIVEAU].
failregex = ^\[[A-Z]+\]\s+<HOST>\s+-\s+FAILED_LOGIN\b
ignoreregex =
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
