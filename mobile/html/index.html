  <script>
    (function() {
      var defaultThemeCss = 'core/themes/core2019_Light/mobile/core2019_Light.css'
      var defaultColorsCss = 'core/themes/core2019_Light/mobile/colors.css'
      function getThemeCookie(name) {
        var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'))
        return match ? decodeURIComponent(match[1]) : null
      }
      var storage = null
      try { storage = window.localStorage } catch (e) {}
      var themeCss = getThemeCookie('jeedom_mobile_theme_css') || (storage ? storage.getItem('jeedom_mobile_theme_css') : null) || defaultThemeCss
      var colorsCss = getThemeCookie('jeedom_mobile_theme_colors_css') || (storage ? storage.getItem('jeedom_mobile_theme_colors_css') : null) || defaultColorsCss
      if (!/^core\/themes\/[A-Za-z0-9_-]+\/mobile\/[A-Za-z0-9_-]+\.css$/.test(themeCss)) themeCss = defaultThemeCss
      if (!/^core\/themes\/[A-Za-z0-9_-]+\/mobile\/colors\.css$/.test(colorsCss)) colorsCss = defaultColorsCss
      var isDarkTheme = /_Dark\/mobile\//.test(themeCss)
      var initialBg = isDarkTheme ? '35,35,37' : '235,235,238'
      var initialText = isDarkTheme ? '172,172,172' : '115,115,115'
      document.write('<style id="jeedom_theme_colors_inline">:root{--bg-color:' + initialBg + ';--txt-color:rgb(' + initialText + ')}html,body,#pagecontainer{background-color:rgb(' + initialBg + ');color:rgb(' + initialText + ')}</style>')
      document.write('<link rel="stylesheet" href="' + colorsCss + '" id="jeedom_theme_colorscss" />')
      document.write('<link rel="stylesheet" href="' + themeCss + '" id="jeedom_theme_currentcss" />')
    })()
